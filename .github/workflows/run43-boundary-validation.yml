name: Run43 independent inner and outer boundary validation
on:
  push:
    branches: [coupled-einstein-dee-evolution]
    paths:
      - '.github/workflows/run43-boundary-validation.yml'
      - 'reproduce/validate_run43_final_boundaries.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN43_ARTIFACT_ID: '11847550871'
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Independently audit preserved fine-grid fields and all refinement pairs
        run: python reproduce/validate_run43_final_boundaries.py
      - name: Preserve audit regardless of gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run43-independent-boundary-audit
          path: reproduce/run43_boundary_validation_20261021.json
          if-no-files-found: warn
