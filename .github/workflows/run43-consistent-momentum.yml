name: Run43 consistent momentum experiment
on:
  push:
    branches: [research/run43-consistent-momentum-20261102]
    paths:
      - 'research/run43_consistent_momentum.py'
      - 'tests/test_run43_consistent_momentum.py'
      - '.github/workflows/run43-consistent-momentum.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      DEE_EXPERIMENT: actions-stabilized-flux
      DEE_SCALAR_ORDER: flux
      DEE_PRECONDITIONER: fourier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Verify frozen audit and run tests
        run: |
          test "$(git hash-object reproduce/diagnose_toroidal_boundary_convergence.py)" = 5e4e54e1e1d84b785c4e66eac9b4d7fffdc43e22
          python -m unittest discover -s tests -v
      - name: Execute fresh four-resolution study
        run: |
          set -o pipefail
          python research/run43_consistent_momentum.py 2>&1 | tee research/execution.log
      - name: Independently recompute frozen twelve-check gate
        run: python research/audit_run43_arrays.py research/results/actions-stabilized-flux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run43-consistent-momentum-evidence
          path: |
            research/results/actions-stabilized-flux/
            research/execution.log
