name: Experimental C3 alpha-beta coupled constraint probe

on:
  pull_request:
    branches: [run43-independent-validation]
    paths:
      - 'reproduce/alpha_beta_c3_coupled_probe.py'
      - '.github/workflows/alpha-beta-c3-coupled-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-beta-c3-coupled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-three-grid-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Run new-source C3 constrained three-resolution solve
        run: python reproduce/alpha_beta_c3_coupled_probe.py 2>&1 | tee alpha_beta_c3_probe.log
      - name: Upload diagnostics even when scientific gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-beta-c3-coupled-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            alpha_beta_c3_probe.log
            reproduce/alpha_beta_c3_coupled_*.json
            reproduce/alpha_beta_c3_fields_*.npz
