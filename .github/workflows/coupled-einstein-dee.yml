name: Coupled Einstein-DEE validation

on:
  push:
    branches: [coupled-einstein-dee-evolution]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Verify BSSN initial-data bridge
        run: |
          cd reproduce
          python bssn_initial_data_bridge.py
      - name: Verify full DEE 3+1 matter source
        run: |
          cd reproduce
          python dee_stress_energy_3p1.py
      - name: Require t=0 tensor-interface gate
        run: |
          cd reproduce
          python evolve_coupled_einstein_dee.py --resolutions 201 401 801 --output coupled_einstein_dee_interface_checkpoint.json
      - name: Ultra-short coupled ADM smoke test
        run: |
          # The evolution kernel is pinned to the immutable commit where it was
          # introduced.  The current branch's independently validated t=0 gate
          # above MUST pass first.  This smoke test is deliberately only t=0.01;
          # it does not inherit a PASS from the interface gate and does not make
          # a full-3D/BSSN or long-time-stability claim.
          git show c3646160a4b6e0f86ee8b7dbc9a1345b0c137201:reproduce/evolve_coupled_einstein_dee.py > reproduce/_pinned_coupled_adm_smoke.py
          cd reproduce
          python _pinned_coupled_adm_smoke.py --resolutions 201 401 801 --t-end 0.01 --cfl 0.10 --output coupled_einstein_dee_smoke_checkpoint.json
      - name: t=0.025 coupled ADM convergence gate
        run: |
          cd reproduce
          python _pinned_coupled_adm_smoke.py --resolutions 201 401 801 --t-end 0.025 --cfl 0.10 --output coupled_einstein_dee_t0025_checkpoint.json
      - name: Diagnose momentum-constraint growth localization
        run: |
          cd reproduce
          python diagnose_coupled_adm_momentum.py --resolutions 201 401 801 --t-end 0.025 --cfl 0.10 --output coupled_einstein_dee_momentum_diagnostic.json
      - name: Compare reduced ADM boundary treatments
        run: |
          cd reproduce
          python compare_coupled_adm_boundaries.py --resolutions 201 401 801 --t-end 0.025 --cfl 0.10 --output coupled_einstein_dee_boundary_comparison.json
      - name: t=0.05 controlled matched-distance extension
        run: |
          # Extension gate: same pinned ADM kernel, initial data, RK4/CFL and
          # frozen two-cell boundary treatment.  Only the evolution duration is
          # doubled relative to the frozen t=0.025 checkpoint.
          cd reproduce
          python diagnose_coupled_adm_momentum.py --resolutions 201 401 801 --t-end 0.05 --cfl 0.10 --output coupled_einstein_dee_t0050_boundary_distance_checkpoint.json
      - name: t=0.10 controlled matched-distance extension
        run: |
          # Run #21 gate: extend the same pinned reduced ADM system to twice
          # the successful t=0.05 duration.  Keep equations, initial data,
          # RK4/CFL, frozen boundary treatment, and 201/401/801 refinement
          # sequence unchanged so this is a clean persistence/convergence test.
          cd reproduce
          python diagnose_coupled_adm_momentum.py --resolutions 201 401 801 --t-end 0.10 --cfl 0.10 --output coupled_einstein_dee_t0100_boundary_distance_checkpoint.json
      - name: t=0.20 controlled matched-distance extension
        run: |
          # Next controlled gate: double only the evolution duration from the
          # frozen t=0.10 checkpoint. Keep the pinned reduced ADM kernel,
          # equations, initial data, RK4/CFL, frozen two-cell boundary
          # treatment, and 201/401/801 refinement sequence unchanged.
          cd reproduce
          python diagnose_coupled_adm_momentum.py --resolutions 201 401 801 --t-end 0.20 --cfl 0.10 --output coupled_einstein_dee_t0200_boundary_distance_checkpoint.json
      - name: Time-resolved constraint-propagation gate
        run: |
          # Referee-readiness diagnostic: do not extend duration or change the
          # formulation. Re-run the frozen t=0.20 setup and sample constraints
          # at matched physical times/distances to measure inward propagation
          # of boundary-associated contamination.
          cd reproduce
          python diagnose_coupled_adm_constraint_propagation.py --resolutions 201 401 801 --t-end 0.20 --cfl 0.10 --sample-times 0.025 0.05 0.10 0.15 0.20 --output coupled_einstein_dee_constraint_propagation.json
      - name: Require propagation checkpoint artifact
        run: |
          # Hard packaging gate: a green run is not acceptable unless the
          # corrected time-aligned propagation JSON actually exists and parses.
          test -s reproduce/coupled_einstein_dee_constraint_propagation.json
          python -m json.tool reproduce/coupled_einstein_dee_constraint_propagation.json > /dev/null
      - name: t=0.40 exact-time persistence gate
        run: |
          # Next scientific gate after the frozen t=0.20 propagation checkpoint.
          # Double duration only. Preserve the pinned reduced ADM equations,
          # initial data, RK4/CFL ceiling, frozen two-cell boundary treatment,
          # and 201/401/801 refinement sequence. Exact-time snapshots distinguish
          # interior persistence from inward-moving boundary contamination.
          cd reproduce
          python diagnose_coupled_adm_constraint_propagation.py --resolutions 201 401 801 --t-end 0.40 --cfl 0.10 --sample-times 0.20 0.25 0.30 0.40 --output coupled_einstein_dee_t0400_constraint_propagation.json
      - name: Require t=0.40 checkpoint artifact
        run: |
          test -s reproduce/coupled_einstein_dee_t0400_constraint_propagation.json
          python -m json.tool reproduce/coupled_einstein_dee_t0400_constraint_propagation.json > /dev/null
      - name: Boundary-contamination-front gate
        run: |
          # Diagnostic only: quantify the inward convergence-loss front without
          # changing equations, initial data, CFL, refinement, or boundaries.
          cd reproduce
          python diagnose_coupled_adm_boundary_front.py --resolutions 201 401 801 --t-end 0.40 --cfl 0.10 --sample-times 0.05 0.10 0.15 0.20 0.25 0.30 0.35 0.40 --output coupled_einstein_dee_boundary_front.json
      - name: Require boundary-front artifact
        run: |
          test -s reproduce/coupled_einstein_dee_boundary_front.json
          python -m json.tool reproduce/coupled_einstein_dee_boundary_front.json > /dev/null
      - name: 3-D toroidal/helical geometry precursor gate
        run: |
          # Additive kinematic gate only. Validate the toroidal chart and the
          # existing helical-path convention before constructing 3-D
          # constraint-satisfying Einstein-DEE initial data.
          cd reproduce
          python validate_toroidal_helical_geometry.py
      - name: Require 3-D geometry precursor artifact
        run: |
          test -s reproduce/toroidal_helical_geometry_gate.json
          python -m json.tool reproduce/toroidal_helical_geometry_gate.json > /dev/null
      - name: Upload numerical checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupled-einstein-dee-checkpoints
          path: |
            reproduce/bssn_initial_data_bridge_checkpoint.json
            reproduce/dee_stress_energy_3p1_checkpoint.json
            reproduce/coupled_einstein_dee_interface_checkpoint.json
            reproduce/coupled_einstein_dee_smoke_checkpoint.json
            reproduce/coupled_einstein_dee_t0025_checkpoint.json
            reproduce/coupled_einstein_dee_momentum_diagnostic.json
            reproduce/coupled_einstein_dee_boundary_comparison.json
            reproduce/coupled_einstein_dee_t0050_boundary_distance_checkpoint.json
            reproduce/coupled_einstein_dee_t0100_boundary_distance_checkpoint.json
            reproduce/coupled_einstein_dee_t0200_boundary_distance_checkpoint.json
            reproduce/coupled_einstein_dee_constraint_propagation.json
            reproduce/coupled_einstein_dee_t0400_constraint_propagation.json
            reproduce/coupled_einstein_dee_boundary_front.json
            reproduce/toroidal_helical_geometry_gate.json
            reproduce/coupled_einstein_dee_constraint_propagation_frozen_checkpoint.json
            reproduce/coupled_einstein_dee_t0200_frozen_checkpoint.json
            reproduce/coupled_einstein_dee_t0025_frozen_checkpoint.json
            reproduce/coupled_einstein_dee_t0050_frozen_checkpoint.json
            reproduce/coupled_einstein_dee_t0100_frozen_checkpoint.json
          if-no-files-found: warn
